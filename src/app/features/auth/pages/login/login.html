<section class="auth-page">
  <div class="auth-card">
    <span class="section-kicker">Acceso</span>
    <h1>Entra en miBarrio</h1>
    <p>Accede a tu cuenta para gestionar tu espacio en la plataforma.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="tu@email.com">
      </label>

      <label>
        <span>Contraseña</span>
        <input type="password" formControlName="password" placeholder="Tu contraseña">
      </label>

      @if (errorMessage) {
        <p class="auth-form__error">{{ errorMessage }}</p>
      }

      <button type="submit">
        {{ loading ? 'Accediendo...' : 'Acceder' }}
      </button>
    </form>

    <p class="auth-card__footer">
      ¿Todavia no tienes cuenta?
      <a routerLink="/signup">Solicitar acceso</a>
    </p>
  </div>
</section>
