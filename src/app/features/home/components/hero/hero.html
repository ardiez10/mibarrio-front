<section class="hero">
  <div class="hero__content">

    <span class="hero__badge">
      Plataforma de barrio
    </span>

    <h1>
      Descubre comercios y ofertas cerca de ti
    </h1>

    <p>
      Conecta con la vida de tu barrio, encuentra promociones
      y apoya el comercio local.
    </p>

    <div class="hero__search">
      <input
        type="text"
        placeholder="Buscar comercios..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="search()" />

      <button type="button" (click)="search()">
        Buscar
      </button>
    </div>

  </div>
</section>
