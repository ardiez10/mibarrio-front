<div class="admin-layout">

  <aside class="admin-sidebar">
    <a class="admin-sidebar__brand" routerLink="/">
      <img src="/images/miBarrio_logo.png" alt="" aria-hidden="true">
      <span>miBarrio</span>
    </a>

    <nav>
      <a routerLink="/admin" routerLinkActive="admin-sidebar__link--active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/solicitudes" routerLinkActive="admin-sidebar__link--active">Solicitudes</a>
        <a routerLink="/admin/usuarios" routerLinkActive="admin-sidebar__link--active">Usuarios</a>
      }
      <a routerLink="/admin/comercios" routerLinkActive="admin-sidebar__link--active">Comercios</a>
      <a routerLink="/admin/ofertas" routerLinkActive="admin-sidebar__link--active">Ofertas</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/noticias" routerLinkActive="admin-sidebar__link--active">Noticias</a>
      }
      <a routerLink="/">Volver a la web</a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <h1>{{ auth.isAdmin() ? 'Panel administrador' : 'Panel comercio' }}</h1>
      <button type="button" class="admin-topbar__logout" (click)="logout()">Salir</button>
    </header>

    <section class="admin-content">
      <router-outlet></router-outlet>
    </section>
  </main>

</div>
