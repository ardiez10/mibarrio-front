<article class="noticia-card">

  <div class="noticia-card__image">
    <img
      [src]="noticia.imagenUrl || noticia.imagen_url || '/images/comercio-placeholder.png'"
      [alt]="noticia.titulo"
      (error)="setFallbackImage($event)">
  </div>

  <div class="noticia-card__content">

    <div class="noticia-card__meta">
      <span>{{ noticia.fuente || 'Noticia local' }}</span>
      <span>{{ noticia.fechaPublicacion || noticia.fecha_publicacion }}</span>
    </div>

    <h3>{{ noticia.titulo }}</h3>

    <p>{{ noticia.descripcion }}</p>

    <a class="noticia-card__button" [routerLink]="['/noticias', noticia.id]">
      Leer más
    </a>

  </div>

</article>
