<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <strong>{{ branding.fullName }}</strong>
      <p>Comercio local y vida de barrio.</p>
    </div>

    <nav class="footer__links" aria-label="Enlaces legales">
      <a routerLink="/aviso-legal">Aviso legal</a>
      <a routerLink="/privacidad">Privacidad</a>
      <a routerLink="/cookies">Cookies</a>
      <a routerLink="/ayuda">Ayuda</a>
    </nav>

    <div class="footer__meta">
      <button
        class="footer__theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-pressed]="isDarkMode">
        {{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}
      </button>
      <p>© 2026 {{ branding.appName }}</p>
    </div>
  </div>
</footer>
