<header class="navbar">
    <div class="navbar__inner">
        <a class="navbar__brand" routerLink="/">
            <img class="navbar__mark" src="/images/miBarrio_logo.png" alt="" aria-hidden="true">
            <span class="navbar__brand-text">
                <span class="navbar__logo">{{ branding.appName }}</span>
                <span class="navbar__place">{{ branding.neighborhoodName }}</span>
            </span>
        </a>

        <nav class="navbar__links">
            <a routerLink="/">Inicio</a>
            <a routerLink="/comercios">Comercios</a>
            <a routerLink="/ofertas">Ofertas</a>
            <a routerLink="/noticias">Noticias</a>
        </nav>

        @if (auth.isLoggedIn()) {
            @if (canAccessPanel()) {
                <a class="navbar__login navbar__login--secondary" routerLink="/admin">Panel</a>
            }
            <button class="navbar__login" type="button" (click)="logout()">Salir</button>
        } @else {
            <div class="navbar__auth">
                <a class="navbar__signup" routerLink="/signup">Registro</a>
                <a class="navbar__login" routerLink="/login">Acceder</a>
            </div>
        }

        <button mat-icon-button class="navbar__menu" type="button" aria-label="Abrir menú" (click)="toggleMenu()">
            <mat-icon>menu</mat-icon>
        </button>
    </div>
</header>

<nav class="mobile-menu" [class.mobile-menu--open]="menuOpen">
    <a routerLink="/" (click)="closeMenu()">Inicio</a>
    <a routerLink="/comercios" (click)="closeMenu()">Comercios</a>
    <a routerLink="/ofertas" (click)="closeMenu()">Ofertas</a>
    <a routerLink="/noticias" (click)="closeMenu()">Noticias</a>
    @if (auth.isLoggedIn()) {
        @if (canAccessPanel()) {
            <a routerLink="/admin" (click)="closeMenu()">Panel</a>
        }
        <button type="button" (click)="logout()">Salir</button>
    } @else {
        <a routerLink="/signup" (click)="closeMenu()">Registro</a>
        <a routerLink="/login" (click)="closeMenu()">Acceder</a>
    }
</nav>
